project_id = "registro-servicio"

[auth]
enabled = true
site_url = "https://servicio.eliasstrizik.com.ar"
additional_redirect_urls = []
enable_signup = true
enable_anonymous_sign_ins = false
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
jwt_expiry = 3600

[auth.rate_limit]
email_sent = 30

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 600

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "acceso@auth.eliasstrizik.com.ar"
sender_name = "Servicio Técnico"

[auth.email.template.magic_link]
subject = "Tu código de acceso — Servicio Técnico"
content_path = "./supabase/templates/otp.html"

[auth.email.template.confirmation]
subject = "Tu código de acceso — Servicio Técnico"
content_path = "./supabase/templates/otp.html"

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/private/before_service_user_created"
