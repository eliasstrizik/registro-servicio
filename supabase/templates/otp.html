<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;background:#f1f3f5;font-family:Arial,sans-serif;color:#191c1d;padding:32px 16px">
  <div style="max-width:480px;margin:auto;background:#fff;border:1px solid #d5dae2;border-top:4px solid #003f87;border-radius:8px;padding:32px">
    <p style="color:#003f87;font-size:14px;font-weight:bold;margin:0 0 20px">SERVICIO TÉCNICO</p>
    <h1 style="font-size:24px;margin:0 0 16px">Tu código de acceso</h1>
    <p>Ingresá este código en la pantalla de inicio de sesión:</p>
    <p style="font-size:36px;font-weight:bold;letter-spacing:8px;color:#003f87;background:#eef4fa;padding:20px;text-align:center">{{ .Token }}</p>
    <p style="font-size:14px;color:#606873">Vence en 10 minutos y se puede usar una sola vez. No lo compartas con nadie.</p>
    <p style="font-size:12px;color:#606873">Si no solicitaste este acceso, podés ignorar el mensaje.</p>
  </div>
</body></html>
